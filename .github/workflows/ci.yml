# CI: build the place with Rojo, lint with selene, check formatting with StyLua.
# Pattern: rokit-pinned toolchain in GitHub Actions (https://github.com/CompeyDev/setup-rokit).
# Note: docs/research/2026-09-24-toolchain.md
# Tests need a running Studio and do not run here (see CLAUDE.md, "Run / test").
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-lint:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the exact tool versions pinned in rokit.toml.
      - uses: CompeyDev/setup-rokit@v0.2.1

      - name: Rojo build
        # rojo build does not create missing output directories.
        run: mkdir -p build && rojo build default.project.json --output build/place.rbxl

      # Lint and format run even if an earlier step failed, so one run reports every problem.
      - name: No binary models in synced paths (.rbxm/.rbxmx are banned)
        if: success() || failure()
        run: |
          # Write the sourcemap first: a failing `rojo sourcemap` must fail this step, not silently skip the grep.
          rojo sourcemap default.project.json --include-non-scripts > sourcemap.json
          if grep -o -E -i '"[^"]*\.rbxmx?"' sourcemap.json; then
            echo "::error::.rbxm/.rbxmx files are banned in Rojo-synced paths (binary, unreviewable). Use .model.json."
            exit 1
          fi

      # Game code gets the plain roblox std; only tests/ may use TestEZ globals (tests/selene.toml). Audit-001 L5.
      # Two steps, not `a && b`, so a src/ lint error never hides tests/ lint errors.
      - name: Selene lint (src, roblox std)
        if: success() || failure()
        run: selene src

      - name: Selene lint (tests, roblox + TestEZ std)
        if: success() || failure()
        run: selene --config tests/selene.toml tests

      - name: StyLua format check
        if: success() || failure()
        run: stylua --check src tests

      # The harness's pure helpers, with no Studio and no network (Task 50). The concurrency that
      # makes `test2` fast only matters with several subjects, which no run here can reach.
      - name: Harness selftest (no Studio)
        if: success() || failure()
        run: python3 tools/studio_mcp.py selftest

      # The pose tool's path rule, its refusals and the poses.json round trip, with no Studio and no
      # Pillow (Task 98). Two of those rules are duplicated in Luau (Viewmodel.paths,
      # Viewmodel.merge), so this pins the Python half against the shipped file.
      - name: Pose tool selftest (no Studio, no Pillow)
        if: success() || failure()
        run: python3 tools/pose.py selftest

      # The review gate's blast-radius rule (Director, 2026-10-02): a change whose code files are
      # ALL first-person viewmodel needs no `test2` line, and ONE file outside that list brings it
      # back. Both directions are proved here, against file lists, with no git and no Claude -- the
      # decision is a pure function of the paths, so it needs neither.
      - name: Review gate selftest (no git, no Claude session)
        if: success() || failure()
        run: python3 tools/agents.py selftest

      # The Meshy tool's validators, builders and parsers, with no key and no network (Task 55).
      # CI never gets a Meshy key, and this step must never need one.
      - name: Meshy tool selftest (no key, no network)
        if: success() || failure()
        run: python3 tools/meshy.py selftest

      # The repo is public (CLAUDE.md, "Public repository: never commit secrets"). Task 49.
      # selftest runs first: it proves each rule still catches its shape and still allows the
      # GitHub noreply address and the <repo>/<assets-dir>/<runs-dir> placeholders. A scan that
      # passes because a pattern silently stopped matching is worse than no scan.
      - name: Upload tool selftest (mocked HTTP, no key, nothing sent)
        run: python3 tools/roblox_upload.py selftest

      - name: Asset-prep presets load and are complete (no Blender in CI)
        # The real selftest drives headless Blender and cannot run here; this catches the cheap
        # half -- the module imports, and EVERY preset's region plan is checked before it prints:
        # a plan with no catch-all, or one naming a region it gives no colours for, fails here.
        run: |
          python3 tools/asset_prep.py recipe > /dev/null
          python3 tools/asset_prep.py recipe --preset animal > /dev/null

      - name: Boar-prep selftest (no Blender, no model, no network)
        # Every pure rule the boar's prep tool rests on: the clip list, the per-animal texture names,
        # the playback rate that stops the feet sliding, the repository boundary and every refusal.
        # The Blender half cannot run here, which is exactly why the host half is all pure.
        run: python3 tools/boar_prep.py selftest

      - name: Privacy and secret scan (local paths, emails, secret shapes)
        if: success() || failure()
        run: |
          python3 tools/privacy_scan.py selftest
          python3 tools/privacy_scan.py scan
