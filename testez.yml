# TestEZ globals for selene (https://roblox.github.io/testez/api-reference/)
base: roblox
globals:
  describe: { args: [{ type: string }, { type: function }] }
  it: { args: [{ type: string }, { type: function }] }
  expect: { args: [{ type: any }] }
  beforeAll: { args: [{ type: function }] }
  afterAll: { args: [{ type: function }] }
  beforeEach: { args: [{ type: function }] }
  afterEach: { args: [{ type: function }] }
  describeFOCUS: { args: [{ type: string }, { type: function }] }
  describeSKIP: { args: [{ type: string }, { type: function }] }
  itFOCUS: { args: [{ type: string }, { type: function }] }
  itSKIP: { args: [{ type: string }, { type: function }] }
  FOCUS: { args: [] }
  SKIP: { args: [] }
